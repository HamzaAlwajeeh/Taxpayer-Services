name: tax_payer
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  curved_navigation_bar: ^1.0.6
  dartz: ^0.10.1
  delightful_toast: ^1.1.0
  dio: ^5.9.0
  dotted_border: ^3.1.0
  file_picker: ^10.3.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^17.2.4
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.4
  get: ^4.7.3
  get_it: ^9.2.0
  go_router: ^17.0.0
  google_fonts: ^6.3.1
  image_picker: ^1.2.1
  intl: ^0.20.2
  open_file: ^3.5.10
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  signals_flutter: ^6.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  intl_utils: ^2.8.14

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700

flutter_intl:
  enabled: true

flutter_assets:
  assets_path:
    - assets/images/
    - assets/icons/
  output_path: lib/core/utils/
  filename: app_images.dart

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/appIcon.png"
  min_sdk_android: 21
